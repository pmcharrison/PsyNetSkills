[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psynetsk-tools"
version = "0.1.0"
description = "Validation and dashboard tooling for the PsyNetSkills workshop repository."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Temporary heavy pin until PsyNet light-core lands; includes audit + skills.
    "psynet @ git+https://gitlab.com/PsyNetDev/PsyNet.git@8e1807aaa14b1ecc2a206ace567ce1d7f5c85332",
    "pyyaml>=6.0.3",
]

[project.scripts]
psynetsk-validate = "psynetsk_tools.validate:main"
psynetsk-export-dashboard-data = "psynetsk_tools.dashboard:main"
psynetsk-import-cursor-costs = "psynetsk_tools.cursor_costs:main"
psynetsk-migrate-attempt-audit = "psynetsk_tools.migrate_attempt_audit:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["psynetsk_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
