[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psynetsk-tools"
version = "0.1.0"
description = "Validation and dashboard tooling for the PsyNetSkills workshop repository."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pin to the open PsyNet MR tip (audit + managed experiment skills).
    # Use the experiment extra: thin bootstrap core alone is not enough for
    # workshop validate/pytest (needs Dallinger and audit render deps).
    "psynet[experiment]",
    "pyyaml>=6.0.3",
]

[project.scripts]
psynetsk-validate = "psynetsk_tools.validate:main"
psynetsk-export-dashboard-data = "psynetsk_tools.dashboard:main"
psynetsk-import-cursor-costs = "psynetsk_tools.cursor_costs:main"
psynetsk-migrate-attempt-audit = "psynetsk_tools.migrate_attempt_audit:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "skills-ref>=0.1.1",
]

[tool.uv.sources]
psynet = { git = "https://gitlab.com/PsyNetDev/PsyNet.git", rev = "dbb097bf43b93a885ffd5ffad3edec89f0e85b7c" }

[tool.setuptools.packages.find]
where = ["."]
include = ["psynetsk_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
